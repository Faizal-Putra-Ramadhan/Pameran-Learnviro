<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Deteksi Emosi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#f5f6f7; --card:#fff; --ink:#1d2b2a; --muted:#7a8584; --line:#e8ebeb; --accent:#17756a;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;padding:24px}
  .layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px}
  .cam{position:relative;aspect-ratio:4/3;overflow:hidden}
  .cam img{width:100%;height:100%;object-fit:cover;display:block}
  .result{position:absolute;top:0;left:50%;transform:translateX(-50%);background:var(--card);
    border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:10px 22px;text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .result small{display:block;font-size:11px;color:var(--muted)}
  .result strong{font-size:28px;font-weight:700;color:var(--accent)}
  h2{font-size:17px;font-weight:600;margin:0 0 12px}
  h3{font-size:14px;font-weight:600;margin:20px 0 10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .sensor{padding:14px 16px}
  .sensor .t{display:flex;align-items:center;gap:8px;font-size:12px}
  .sensor svg{width:15px;height:15px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sensor .v{font-size:34px;font-weight:400;margin-top:10px}
  .sensor .u{font-size:13px;color:var(--muted);margin-left:4px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--muted);font-weight:500;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
  td{padding:11px 14px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  .log{overflow:hidden}
  .empty{color:var(--muted);padding:16px 14px;font-size:12px}
  .panel{padding:16px}
  .dist-row{display:grid;grid-template-columns:90px 1fr 44px;align-items:center;gap:10px;font-size:13px;margin-bottom:10px}
  .dist-row:last-child{margin-bottom:0}
  .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .4s}
  .dist-row b{font-weight:500;text-align:right;color:var(--muted)}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{font:inherit;font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--muted);cursor:pointer}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #chart{width:100%;height:auto;display:block}
  #chart text{font-size:10px;fill:var(--muted)}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <div>
  <div class="card cam">
    <img src="/video_feed" alt="Kamera preview">
    <div class="result"><small>Hasil Klasifikasi</small><strong id="emosi">-</strong></div>
  </div>
  <h3>Distribusi Emosi</h3>
  <div class="card panel" id="dist"><span class="empty" style="padding:0">Menunggu data...</span></div>
  </div>

  <div>
    <h2>Kondisi Ruangan</h2>
    <div class="grid">
      <div class="card sensor"><div class="t">
        <svg viewBox="0 0 24 24"><path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/></svg>Suhu</div>
        <div class="v"><span id="suhu">-</span><span class="u">°C</span></div></div>
      <div class="card sensor"><div class="t">
        <svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg>Suara</div>
        <div class="v"><span id="suara">-</span><span class="u">dB</span></div></div>
      <div class="card sensor"><div class="t">
        <svg viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>Kelembapan</div>
        <div class="v"><span id="kelembapan">-</span><span class="u">%</span></div></div>
      <div class="card sensor"><div class="t">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Cahaya</div>
        <div class="v"><span id="cahaya">-</span><span class="u">lux</span></div></div>
    </div>

    <h3>Log Hasil Deteksi</h3>
    <div class="card log">
      <table><thead><tr><th style="width:90px">Waktu</th><th>Hasil Deteksi</th></tr></thead>
        <tbody id="log"><tr><td colspan="2" class="empty">Menunggu data...</td></tr></tbody></table>
    </div>

    <h3>Tren Sensor</h3>
    <div class="card panel">
      <div class="tabs" id="tabs"></div>
      <svg id="chart" viewBox="0 0 480 190" role="img" aria-label="Grafik tren sensor"></svg>
    </div>
  </div>
</div>

<script>
const fmt = (v, d) => (v === null || v === undefined) ? '-' : Number(v).toFixed(d).replace('.', ',');
const $ = id => document.getElementById(id);

const SENSORS = {
  suhu:{label:'Suhu',unit:'°C',d:1}, kelembapan:{label:'Kelembapan',unit:'%',d:0},
  suara:{label:'Suara',unit:'dB',d:0}, cahaya:{label:'Cahaya',unit:'lux',d:0}
};
let aktif = 'suhu', riwayat = [];

function renderTabs() {
  $('tabs').innerHTML = Object.entries(SENSORS).map(([k, v]) =>
    `<button data-k="${k}" class="${k === aktif ? 'on' : ''}">${v.label}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { aktif = b.dataset.k; renderTabs(); drawChart(); });
}

function drawChart() {
  const svg = $('chart'), m = SENSORS[aktif];
  const pts = riwayat.filter(p => p[aktif] !== null && p[aktif] !== undefined);
  if (pts.length < 2) {
    svg.innerHTML = '<text x="240" y="95" text-anchor="middle" style="font-size:12px">Mengumpulkan data...</text>';
    return;
  }
  const W = 480, H = 190, L = 44, R = 12, T = 12, B = 26;
  let lo = Math.min(...pts.map(p => p[aktif])), hi = Math.max(...pts.map(p => p[aktif]));
  if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.15; lo -= pad; hi += pad;
  const x = i => L + (W - L - R) * i / (pts.length - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const line = pts.map((p, i) => `${x(i).toFixed(1)},${y(p[aktif]).toFixed(1)}`).join(' ');
  const area = `${L},${H - B} ${line} ${x(pts.length - 1).toFixed(1)},${H - B}`;
  const fy = v => Number(v).toFixed(m.d).replace('.', ',');
  const jam = t => new Date(t).toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  let grid = '';
  for (let i = 0; i < 4; i++) {
    const v = lo + (hi - lo) * i / 3, yy = y(v);
    grid += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/>` +
            `<text x="${L - 6}" y="${yy + 3}" text-anchor="end">${fy(v)}</text>`;
  }
  svg.innerHTML = grid +
    `<polygon points="${area}" fill="var(--accent)" opacity=".12"/>` +
    `<polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>` +
    `<text x="${L}" y="${H - 8}">${jam(pts[0].t)}</text>` +
    `<text x="${W - R}" y="${H - 8}" text-anchor="end">${jam(pts[pts.length - 1].t)}</text>` +
    `<text x="${W - R}" y="${T - 2}" text-anchor="end">${m.unit}</text>`;
}

function renderDist(counts) {
  const ent = Object.entries(counts || {}).sort((a, b) => b[1] - a[1]);
  const total = ent.reduce((s, e) => s + e[1], 0);
  $('dist').innerHTML = total === 0
    ? '<span class="empty" style="padding:0">Belum ada wajah terdeteksi.</span>'
    : ent.map(([k, n]) => {
        const p = n / total * 100;
        return `<div class="dist-row"><span>${k}</span><div class="bar"><i style="width:${p}%"></i></div><b>${Math.round(p)}%</b></div>`;
      }).join('');
}

async function loadHistory() {
  try { riwayat = await (await fetch('/api/history')).json(); drawChart(); } catch (e) {}
}

async function refresh() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    $('emosi').textContent = s.emotion || 'Tidak ada wajah';
    $('suhu').textContent = fmt(s.sensor.suhu, 1);
    $('kelembapan').textContent = fmt(s.sensor.kelembapan, 0);
    $('suara').textContent = fmt(s.sensor.suara, 0);
    $('cahaya').textContent = fmt(s.sensor.cahaya, 0);
    const rows = s.log.slice(0, 8).map(l => `<tr><td>${l.waktu}</td><td>${l.hasil}</td></tr>`).join('');
    renderDist(s.counts);
    $('log').innerHTML = rows || '<tr><td colspan="2" class="empty">Belum ada wajah terdeteksi.</td></tr>';
  } catch (e) { /* server belum siap, coba lagi */ }
}
renderTabs(); drawChart();
refresh(); setInterval(refresh, 1000);
loadHistory(); setInterval(loadHistory, 4000);
</script>
</body>
</html>
